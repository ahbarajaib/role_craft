name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger VPS Deploy via Webhook
        continue-on-error: true
        run: |
          curl -4 -sS -X POST \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 2 \
            --retry-delay 1 \
            -H "X-Deploy-Token: 1d2448ca44d83cc492294209344be2a6abef16fa" \
            -H "Content-Type: application/json" \
            https://api.rolecraft.tech/deploy-webhook || echo "VPS Webhook trigger completed."




