name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/role_craft
            git pull origin main
            cp nginx/rolecraft /etc/nginx/sites-available/rolecraft
            ln -sf /etc/nginx/sites-available/rolecraft /etc/nginx/sites-enabled/rolecraft
            certbot --nginx -d api.rolecraft.tech --non-interactive --agree-tos -m admin@rolecraft.tech --redirect
            nginx -t && systemctl reload nginx
            docker compose down
            docker compose up -d --build
