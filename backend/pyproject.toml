[project]
name = "resume-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "openai>=1.57.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
    "sqlalchemy>=2.0.31",
    "bcrypt>=4.1.3",
    "pyjwt>=2.8.0",
    "google-auth>=2.30.0",
    "requests>=2.32.3",
    "razorpay>=1.4.1",
    "reportlab>=4.1.0",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.15.0",
    "playwright>=1.61.0",
    "pymupdf>=1.28.2",
    "sentry-sdk[fastapi]>=2.0.0",
    "alembic>=1.20.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "BLE001",
    "UP045",
    "E741",
    "B904",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::Warning:starlette.*",
    "ignore:.*starlette.*:Warning",
    "ignore:.*httpx.*:Warning",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

