services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rolecraft-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - UPLOAD_DIR=/app/uploads
      - DATABASE_FILE=/app/data/rolecraft.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_SECRET=${JWT_SECRET:-supersecretrolecraftkey}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - ALLOWED_ORIGINS=["https://rolecraft.tech", "https://www.rolecraft.tech", "https://admin.rolecraft.tech", "http://localhost:3000"]
    restart: always
